name: Water dashboard UI tests

on:
  push:
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression (blank = everything)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1-5"   # weekday mornings, 06:17 UTC

jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      HEADLESS: "true"
      BASE_URL: ${{ vars.WATER_BASE_URL || 'https://dtinto-water-dashboard.web.app' }}
      # Logged-in scenarios are skipped automatically when these secrets aren't set.
      WATER_EMAIL: ${{ secrets.WATER_EMAIL }}
      WATER_PASSWORD: ${{ secrets.WATER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Cucumber scenarios
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            mvn -B test "-Dcucumber.filter.tags=${{ github.event.inputs.tags }}"
          else
            mvn -B test
          fi

      - name: Summarise scenarios
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "target/cucumber-report.json"
          if not os.path.exists(path):
              print("::error::No Cucumber report was produced"); sys.exit(1)
          rows, counts = [], {"passed": 0, "failed": 0, "skipped": 0}
          for feature in json.load(open(path)):
              for s in feature.get("elements", []):
                  if s.get("type") != "scenario":
                      continue
                  steps = s.get("before", []) + s.get("steps", []) + s.get("after", [])
                  states = [st["result"]["status"] for st in steps]
                  status = "failed" if "failed" in states else "skipped" if ("skipped" in states or "pending" in states or "undefined" in states) else "passed"
                  counts[status] += 1
                  note = next((st["result"].get("error_message", "").splitlines()[0] for st in steps if st["result"]["status"] == "failed" and st["result"].get("error_message")), "")
                  rows.append(f"| {'✅' if status == 'passed' else '❌' if status == 'failed' else '⏭️'} {status} | {feature['name']} | {s['name']} | {note[:150]} |")
          total = sum(counts.values())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### {total} scenarios: {counts['passed']} passed, {counts['failed']} failed, {counts['skipped']} skipped\n\n")
              out.write("| Result | Feature | Scenario | Error |\n|---|---|---|---|\n" + "\n".join(rows) + "\n")
          print(counts)
          if total == 0:
              print("::error::No scenarios ran - check the features path and runner"); sys.exit(1)
          PY

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            target/cucumber-report.html
            target/cucumber-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14
